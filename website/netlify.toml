# Netlify site base directory: website/
[build]
  command = "npm run build"
  publish = "dist"
  # Rebuild when the site OR the game data (../data/*.csv) changed.
  # Exit 0 = skip; any other exit code (incl. unknown cached ref) = build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../data"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
