name: Update game data

# Checks twilightwars.com for newly finished group games and commits them.
# The push to main triggers a Netlify rebuild.
#
# Required repository secrets: TW_EMAIL, TW_PASSWORD
#   gh secret set TW_EMAIL
#   gh secret set TW_PASSWORD

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      game_id:
        description: "Optional: import only this game id"
        required: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch new games
        env:
          TW_EMAIL: ${{ secrets.TW_EMAIL }}
          TW_PASSWORD: ${{ secrets.TW_PASSWORD }}
          GAME_ID: ${{ github.event.inputs.game_id }}
        run: python scripts/update_ti_stats.py --non-interactive ${GAME_ID:+"$GAME_ID"}
